<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نتائج الطلاب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #059669;
            --success-bg: #d1fae5;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --danger-border: #fecaca;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .search-card {
            text-align: center;
            border-top: 4px solid var(--primary);
        }

        .search-card h1 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .search-card p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 1.05rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-family: 'Tajawal', sans-serif;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button {
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: #1e40af;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            text-align: center;
            color: var(--danger);
            font-weight: 600;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: var(--danger-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--danger-border);
            max-width: 500px;
            margin: 0 auto;
        }

        .error-message.show {
            opacity: 1;
        }

        .loading {
            text-align: center;
            color: var(--primary);
            font-weight: 600;
            font-size: 1rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(30, 58, 138, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* تصميم بطاقة النتيجة */
        .result-card {
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            text-align: center;
            padding-bottom: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }

        .result-header .label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-header h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .class-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1px solid #bfdbfe;
        }

        /* ========================================== */
        /* تصميم الجدول (أسطر متتالية بدلاً من مربعات) */
        /* ========================================== */
        .grades-table-container {
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .grades-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        .grades-table thead {
            background: #f8fafc;
        }

        .grades-table th {
            padding: 16px 24px;
            text-align: right;
            font-weight: 700;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.95rem;
        }

        .grades-table th:last-child {
            text-align: center;
        }

        .grades-table td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .grades-table td:last-child {
            text-align: center;
        }

        .grades-table tbody tr:last-child td {
            border-bottom: none;
        }

        .grades-table tbody tr:hover {
            background: #f8fafc;
        }

        .subject-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .subject-grade {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* تنسيق خاص للسطر الراسب (أقل من 50) */
        .grades-table tbody tr.failed-row {
            background: var(--danger-bg);
        }

        .grades-table tbody tr.failed-row:hover {
            background: #fee2e2;
        }

        .grades-table tbody tr.failed-row .subject-name {
            color: var(--danger);
            font-weight: 700;
        }

        .grades-table tbody tr.failed-row .subject-grade {
            color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
            padding: 4px 16px;
            border-radius: 6px;
            border: 1px solid var(--danger-border);
            display: inline-block;
        }

        /* قسم الملخص */
        .summary-section {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding-top: 24px;
            border-top: 2px solid var(--border-color);
            flex-wrap: wrap;
        }

        .info-box {
            text-align: center;
            padding: 20px 40px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            min-width: 180px;
        }

        .info-box span {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .info-box strong {
            display: block;
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-primary);
        }

        .status-box.pass {
            background: var(--success-bg);
            border-color: #6ee7b7;
        }
        .status-box.pass strong {
            color: var(--success);
        }

        .status-box.fail {
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }
        .status-box.fail strong {
            color: var(--danger);
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            .result-header h2 {
                font-size: 1.6rem;
            }
            .summary-section {
                flex-direction: column;
            }
            .info-box {
                width: 100%;
            }
            .card {
                padding: 24px;
            }
            .grades-table th, .grades-table td {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بطاقة البحث -->
        <div class="card search-card">
            <h1>نظام الاستعلام عن النتائج</h1>
            <p>أدخل كود الطالب الخاص بك لعرض كشف العلامات الرسمي</p>
            <div class="input-group">
                <input type="text" id="studentCode" placeholder="أدخل كود الطالب هنا..." autocomplete="off">
                <button id="searchBtn" onclick="searchResult()">
                    <span id="btnText">بحث</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
            <p id="errorMessage" class="error-message"></p>
            <p id="loadingMessage" class="loading">جاري الاتصال بقاعدة البيانات <span class="spinner"></span></p>
        </div>

        <!-- بطاقة النتيجة -->
        <div class="card result-card" id="resultCard">
            <div class="result-header">
                <span class="label">اسم الطالب</span>
                <h2 id="studentName">اسم الطالب</h2>
                <span id="studentClass" class="class-badge">الصف</span>
            </div>
            
            <!-- تم استبدال الشبكة بجدول رسمي -->
            <div class="grades-table-container">
                <table class="grades-table">
                    <thead>
                        <tr>
                            <th>المادة الدراسية</th>
                            <th>العلامة</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- سيتم حقن الأسطر هنا تلقائياً -->
                    </tbody>
                </table>
            </div>

            <div class="summary-section" id="summarySection">
                <div class="info-box" id="averageBox">
                    <span>المعدل العام</span>
                    <strong id="studentAverage">0.00</strong>
                </div>
                <div class="info-box status-box" id="statusBox">
                    <span>الحالة النهائية</span>
                    <strong id="studentStatus">ناجح</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWdZi-3ePMb5-XUSYWtfNya8YDv9lwQfKIDODal6mq_GkYxyRlGgbn21fgcTqu0cwTzNANEigpZhQj/pub?output=csv';
        let sheetData = [];
        let isDataLoaded = false;

        async function fetchSheetData() {
            const loadingMessage = document.getElementById('loadingMessage');
            const searchBtn = document.getElementById('searchBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            searchBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            loadingMessage.style.display = 'flex';
            
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل في الاتصال');
                const csvText = await response.text();
                sheetData = parseCSV(csvText);
                isDataLoaded = true;
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('errorMessage').textContent = 'حدث خطأ في جلب البيانات. يرجى تحديث الصفحة.';
                document.getElementById('errorMessage').classList.add('show');
            } finally {
                searchBtn.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
                loadingMessage.style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length >= headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                    });
                    data.push(obj);
                }
            }
            return data;
        }

        function searchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const resultCard = document.getElementById('resultCard');
            
            errorMessage.textContent = '';
            errorMessage.classList.remove('show');
            resultCard.classList.remove('show');
            
            if (!isDataLoaded) {
                errorMessage.textContent = 'جاري تحميل البيانات، يرجى الانتظار قليلاً...';
                errorMessage.classList.add('show');
                return;
            }
            
            if (!codeInput) {
                errorMessage.textContent = 'يرجى إدخال كود الطالب';
                errorMessage.classList.add('show');
                return;
            }
            
            const student = sheetData.find(row => row['الكود'] && row['الكود'].toString().trim() === codeInput);
            
            if (!student) {
                errorMessage.textContent = 'لم يتم العثور على نتيجة لهذا الكود';
                errorMessage.classList.add('show');
                return;
            }
            
            document.getElementById('studentName').textContent = student['الاسم'] || 'غير محدد';
            document.getElementById('studentClass').textContent = student['الصف'] || 'غير محدد';
            
            const subjects = ['الرياضيات', 'الفيزياء', 'الكيمياء', 'الأحياء', 'العربي', 'الكردي', 'الإنكليزية', 'الإسلامية'];
            const resultsTableBody = document.getElementById('resultsTableBody');
            resultsTableBody.innerHTML = '';
            
            subjects.forEach(subject => {
                const gradeStr = student[subject];
                const grade = parseFloat(gradeStr);
                const isFailed = !isNaN(grade) && grade < 50;
                
                // إنشاء سطر (tr) بدلاً من مربع (div)
                const row = document.createElement('tr');
                row.className = isFailed ? 'failed-row' : '';
                row.innerHTML = `
                    <td class="subject-name">${subject}</td>
                    <td><span class="subject-grade">${isNaN(grade) ? '-' : grade}</span></td>
                `;
                resultsTableBody.appendChild(row);
            });
            
            const status = student['النتيجة'];
            const averageBox = document.getElementById('averageBox');
            const statusBox = document.getElementById('statusBox');
            
            if (status && status.includes('راسب')) {
                averageBox.style.display = 'none';
                statusBox.className = 'info-box status-box fail';
                document.getElementById('studentStatus').textContent = 'راسب';
            } else {
                averageBox.style.display = 'block';
                document.getElementById('studentAverage').textContent = student['المعدل'] || '0.00';
                document.getElementById('studentStatus').textContent = status || 'ناجح';
                statusBox.className = 'info-box status-box pass';
            }
            
            resultCard.style.display = 'block';
            void resultCard.offsetWidth; 
            resultCard.classList.add('show');
        }

        document.getElementById('studentCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchResult();
            }
        });

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
