<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام عن نتائج الطلاب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a; /* أزرق داكن رسمي */
            --primary-light: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --success-color: #15803d;
            --success-bg: #dcfce7;
            --danger-color: #991b1b;
            --danger-bg: #fef2f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .main-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* Header رسمي */
        .official-header {
            background: var(--primary-color);
            color: white;
            padding: 30px 40px;
            text-align: center;
            border-bottom: 4px solid #fbbf24; /* خط ذهبي رسمي */
            position: relative;
        }

        .official-header svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .official-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .official-header p {
            font-size: 0.95rem;
            opacity: 0.85;
            font-weight: 400;
        }

        /* قسم البحث */
        .search-section {
            padding: 30px 40px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }

        .search-form {
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s ease;
            background: white;
        }

        input[type="text"]:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-search {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            color: white;
            background: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px; /* لمحاذاة الزر مع حقل الإدخال */
        }

        .btn-search:hover {
            background: #1e40af;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .btn-search:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .message-box {
            text-align: center;
            padding: 12px;
            margin-top: 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
        }

        .message-box.error {
            background: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid #fecaca;
            display: block;
        }

        .message-box.loading {
            background: #eff6ff;
            color: var(--primary-color);
            border: 1px solid #bfdbfe;
            display: block;
        }

        /* قسم النتيجة */
        .result-section {
            padding: 40px;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .student-info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .info-item label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-item span {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* جدول العلامات الرسمي */
        .grades-table-container {
            overflow-x: auto;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .grades-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .grades-table th {
            background: #f1f5f9;
            color: var(--text-secondary);
            font-weight: 700;
            padding: 14px 16px;
            text-align: right;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        .grades-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .grades-table tr:last-child td {
            border-bottom: none;
        }

        .grades-table tr:hover {
            background: #fafafa;
        }

        /* تنسيق الخانة الحمراء للراسب */
        .failed-grade {
            background-color: var(--danger-bg);
            color: var(--danger-color);
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #fecaca;
            display: inline-block;
            min-width: 50px;
            text-align: center;
        }

        .pass-grade {
            font-weight: 600;
            color: var(--success-color);
        }

        /* قسم الملخص (المعدل والحالة) */
        .summary-section {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        .summary-box {
            text-align: center;
            padding: 16px 32px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            min-width: 160px;
        }

        .summary-box label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .summary-box .value {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .status-pass {
            background: var(--success-bg);
            border-color: #bbf7d0;
        }
        .status-pass .value {
            color: var(--success-color);
        }

        .status-fail {
            background: var(--danger-bg);
            border-color: #fecaca;
        }
        .status-fail .value {
            color: var(--danger-color);
        }

        /* تنسيق الطباعة الرسمي */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .main-container {
                box-shadow: none;
                border: 2px solid #000;
                max-width: 100%;
            }
            .search-section, .btn-search {
                display: none !important;
            }
            .official-header {
                background: white !important;
                color: black !important;
                border-bottom: 2px solid black;
                -webkit-print-color-adjust: exact;
            }
            .official-header svg {
                fill: black;
            }
            .grades-table th {
                background: #eee !important;
                -webkit-print-color-adjust: exact;
            }
            .failed-grade {
                border: 1px solid red;
                color: red;
                -webkit-print-color-adjust: exact;
            }
        }

        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }
            .btn-search {
                width: 100%;
                margin-top: 8px;
                justify-content: center;
            }
            .summary-section {
                flex-direction: column;
            }
            .summary-box {
                width: 100%;
            }
            .official-header {
                padding: 20px;
            }
            .result-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- رأس الصفحة الرسمي -->
        <div class="official-header">
            <!-- أيقونة شعار تعليمي رسمي -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
            <h1>نظام الاستعلام عن نتائج الطلاب</h1>
            <p>الرجاء إدخال كود الطالب الرباعي أو الخماسي للاستعلام عن النتيجة الرسمية</p>
        </div>

        <!-- قسم البحث -->
        <div class="search-section">
            <div class="search-form">
                <div class="input-group">
                    <label for="studentCode">كود الطالب</label>
                    <input type="text" id="studentCode" placeholder="مثال: 1024" autocomplete="off" inputmode="numeric">
                </div>
                <button class="btn-search" id="searchBtn" onclick="searchResult()">
                    <span>استعلام</span>
                    <svg id="btnSpinner" style="display: none; width: 18px; height: 18px; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                </button>
            </div>
            <div id="messageBox" class="message-box"></div>
        </div>

        <!-- قسم عرض النتيجة -->
        <div id="resultSection" class="result-section">
            <!-- معلومات الطالب الأساسية -->
            <div class="student-info-bar">
                <div class="info-item">
                    <label>اسم الطالب</label>
                    <span id="resName">-</span>
                </div>
                <div class="info-item">
                    <label>كود الطالب</label>
                    <span id="resCode">-</span>
                </div>
                <div class="info-item">
                    <label>الصف الدراسي</label>
                    <span id="resClass">-</span>
                </div>
            </div>

            <!-- جدول العلامات -->
            <div class="grades-table-container">
                <table class="grades-table">
                    <thead>
                        <tr>
                            <th style="width: 60%;">المادة الدراسية</th>
                            <th style="width: 40%; text-align: center;">العلامة</th>
                        </tr>
                    </thead>
                    <tbody id="gradesBody">
                        <!-- سيتم ملء المواد هنا ديناميكياً -->
                    </tbody>
                </table>
            </div>

            <!-- ملخص النتيجة (يظهر فقط إذا لم يكن راسباً) -->
            <div id="summarySection" class="summary-section">
                <div class="summary-box">
                    <label>المعدل العام</label>
                    <span class="value" id="resAverage">0.00</span>
                </div>
                <div class="summary-box" id="statusBox">
                    <label>الحالة النهائية</label>
                    <span class="value" id="resStatus">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWdZi-3ePMb5-XUSYWtfNya8YDv9lwQfKIDODal6mq_GkYxyRlGgbn21fgcTqu0cwTzNANEigpZhQj/pub?output=csv';
        let sheetData = [];
        let isDataLoaded = false;

        // مفاتيح البيانات الأساسية لاستبعادها من قائمة المواد
        const META_KEYS = ['الكود', 'الاسم', 'الصف', 'المعدل', 'النتيجة', 'الحالة', 'ملاحظات'];

        async function fetchSheetData() {
            const btn = document.getElementById('searchBtn');
            const spinner = document.getElementById('btnSpinner');
            const msgBox = document.getElementById('messageBox');
            
            btn.disabled = true;
            spinner.style.display = 'block';
            msgBox.className = 'message-box loading';
            msgBox.textContent = 'جاري الاتصال بقاعدة البيانات وجلب السجلات...';
            msgBox.style.display = 'block';

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل الاتصال');
                const csvText = await response.text();
                sheetData = parseCSV(csvText);
                isDataLoaded = true;
                msgBox.style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                msgBox.className = 'message-box error';
                msgBox.textContent = 'عذراً، حدث خطأ في الاتصال بالخادم. يرجى تحديث الصفحة والمحاولة لاحقاً.';
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                // معالجة متقدمة لفصل القيم مع مراعاة الفواصل داخل النصوص
                const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                if (values.length >= headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        let val = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                        obj[header] = val;
                    });
                    data.push(obj);
                }
            }
            return data;
        }

        function searchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const msgBox = document.getElementById('messageBox');
            const resultSection = document.getElementById('resultSection');
            
            // إعادة تعيين الحالة
            msgBox.style.display = 'none';
            resultSection.style.display = 'none';
            
            if (!isDataLoaded) {
                msgBox.className = 'message-box error';
                msgBox.textContent = 'البيانات لا تزال قيد التحميل، يرجى الانتظار بضع ثوانٍ...';
                msgBox.style.display = 'block';
                return;
            }
            
            if (!codeInput) {
                msgBox.className = 'message-box error';
                msgBox.textContent = 'يرجى إدخال كود الطالب بشكل صحيح.';
                msgBox.style.display = 'block';
                return;
            }
            
            // البحث عن الطالب (مقارنة مرنة)
            const student = sheetData.find(row => row['الكود'] && row['الكود'].toString().trim() === codeInput);
            
            if (!student) {
                // إذا لم يوجد، لا يتم عرض أي نتيجة (فقط رسالة خطأ رسمية)
                msgBox.className = 'message-box error';
                msgBox.textContent = 'لم يتم العثور على أي سجلات مطابقة لهذا الكود. يرجى التأكد من الرقم والمحاولة مجدداً.';
                msgBox.style.display = 'block';
                return;
            }
            
            // عرض البيانات الأساسية
            document.getElementById('resName').textContent = student['الاسم'] || 'غير محدد';
            document.getElementById('resCode').textContent = student['الكود'] || codeInput;
            document.getElementById('resClass').textContent = student['الصف'] || 'غير محدد';
            
            // بناء جدول المواد ديناميكياً
            const gradesBody = document.getElementById('gradesBody');
            gradesBody.innerHTML = '';
            
            let hasFailedSubject = false;
            
            Object.keys(student).forEach(key => {
                // تجاهل المفاتيح الأساسية والمفارغ
                if (META_KEYS.includes(key) || !student[key] || student[key].trim() === '') return;
                
                const gradeVal = parseFloat(student[key]);
                const isFailed = !isNaN(gradeVal) && gradeVal < 50;
                
                if (isFailed) hasFailedSubject = true;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${key}</td>
                    <td style="text-align: center;">
                        <span class="${isFailed ? 'failed-grade' : 'pass-grade'}">
                            ${isNaN(gradeVal) ? student[key] : gradeVal}
                        </span>
                    </td>
                `;
                gradesBody.appendChild(tr);
            });
            
            // منطق عرض/إخفاء المعدل بناءً على حالة "راسب"
            const summarySection = document.getElementById('summarySection');
            const statusBox = document.getElementById('statusBox');
            const statusText = student['النتيجة'] || student['الحالة'] || 'غير محدد';
            
            // التحقق الحاسم: إذا كانت النتيجة تحتوي على كلمة "راسب"
            if (statusText.includes('راسب') || hasFailedSubject) {
                // إخفاء قسم المعدل تماماً كما طُلب
                summarySection.style.display = 'none';
                
                // إضافة ملاحظة رسمية صغيرة في الأسفل توضح حالة الرسوب للمواد فقط
                const failNote = document.createElement('div');
                failNote.style.cssText = 'text-align: center; margin-top: 20px; color: #991b1b; font-weight: 600; font-size: 0.9rem; padding: 10px; background: #fef2f2; border-radius: 6px; border: 1px solid #fecaca;';
                failNote.textContent = 'تنويه: الطالب غير مستوفي لشروط النجاح في بعض المواد.';
                
                // إزالة أي ملاحظة سابقة قبل إضافة جديدة
                const oldNote = document.getElementById('failNote');
                if(oldNote) oldNote.remove();
                failNote.id = 'failNote';
                document.getElementById('resultSection').appendChild(failNote);
                
            } else {
                // إظهار المعدل والحالة (ناجح)
                const oldNote = document.getElementById('failNote');
                if(oldNote) oldNote.remove();
                
                summarySection.style.display = 'flex';
                document.getElementById('resAverage').textContent = student['المعدل'] || '0.00';
                document.getElementById('resStatus').textContent = statusText;
                
                statusBox.className = 'summary-box status-pass';
            }
            
            // إظهار قسم النتيجة بتأثير رسمي هادئ
            resultSection.style.display = 'block';
        }

        // دعم مفتاح Enter للبحث
        document.getElementById('studentCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchResult();
            }
        });

        // بدء التحميل عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
