<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نتائج الطلاب الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* خلفية متحركة بتأثير ثلاثي الأبعاد */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: #6366f1; top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #ec4899; bottom: -50px; left: -50px; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: translateY(-5px) rotateX(2deg);
            box-shadow: 
                0 35px 60px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-card h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .search-card p {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-family: 'Tajawal', sans-serif;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), inset 0 2px 4px rgba(0,0,0,0.3);
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 
                0 10px 20px -5px rgba(99, 102, 241, 0.4),
                0 4px 6px -2px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5), 0 8px 10px -4px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px -5px rgba(99, 102, 241, 0.4), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .error-message {
            text-align: center;
            color: var(--danger);
            font-weight: 500;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }

        /* تصميم بطاقة النتيجة */
        .result-card {
            display: none;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .student-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
        }

        .class-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .subject-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* تنسيق خاص للمواد الراسبة (أقل من 50) */
        .subject-card.failed {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .subject-card.failed .subject-grade {
            color: #fca5a5;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .subject-name {
            display: block;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .subject-grade {
            display: block;
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
        }

        .average-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-box {
            text-align: center;
            padding: 20px 40px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 150px;
        }

        .info-box span {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .info-box strong {
            display: block;
            font-size: 2rem;
            font-weight: 900;
            color: white;
        }

        .status-box.pass {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }
        .status-box.pass strong {
            color: #6ee7b7;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            display: none;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            .student-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .average-section {
                flex-direction: column;
                gap: 15px;
            }
            .info-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <div class="card search-card">
            <h1>نظام نتائج الطلاب</h1>
            <p>أدخل كود الطالب الخاص بك للاستعلام عن النتيجة فوراً</p>
            <div class="input-group">
                <input type="text" id="studentCode" placeholder="أدخل كود الطالب هنا..." autocomplete="off">
                <button id="searchBtn" onclick="searchResult()">
                    <span id="btnText">بحث</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
            <p id="errorMessage" class="error-message"></p>
            <p id="loadingMessage" class="loading">جاري تحميل البيانات من السحابة <span class="spinner"></span></p>
        </div>

        <div class="card result-card" id="resultCard">
            <div class="student-header">
                <h2 id="studentName">اسم الطالب</h2>
                <span id="studentClass" class="class-badge">الصف</span>
            </div>
            
            <div class="results-grid" id="resultsGrid">
                <!-- سيتم حقن المواد هنا تلقائياً -->
            </div>

            <div class="average-section" id="averageSection">
                <div class="info-box">
                    <span>المعدل العام</span>
                    <strong id="studentAverage">0.00</strong>
                </div>
                <div class="info-box status-box" id="statusBox">
                    <span>الحالة النهائية</span>
                    <strong id="studentStatus">ناجح</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWdZi-3ePMb5-XUSYWtfNya8YDv9lwQfKIDODal6mq_GkYxyRlGgbn21fgcTqu0cwTzNANEigpZhQj/pub?output=csv';
        let sheetData = [];
        let isDataLoaded = false;

        // جلب البيانات من جدول جوجل عند تحميل الصفحة
        async function fetchSheetData() {
            const loadingMessage = document.getElementById('loadingMessage');
            loadingMessage.style.display = 'block';
            
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل في الاتصال');
                const csvText = await response.text();
                sheetData = parseCSV(csvText);
                isDataLoaded = true;
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('errorMessage').textContent = 'حدث خطأ في جلب البيانات. يرجى تحديث الصفحة.';
                document.getElementById('errorMessage').classList.add('show');
            } finally {
                loadingMessage.style.display = 'none';
            }
        }

        // تحليل بيانات CSV
        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length >= headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                    });
                    data.push(obj);
                }
            }
            return data;
        }

        // دالة البحث
        function searchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const resultCard = document.getElementById('resultCard');
            
            errorMessage.textContent = '';
            errorMessage.classList.remove('show');
            resultCard.classList.remove('show');
            
            if (!isDataLoaded) {
                errorMessage.textContent = 'جاري تحميل البيانات، يرجى الانتظار قليلاً...';
                errorMessage.classList.add('show');
                return;
            }
            
            if (!codeInput) {
                errorMessage.textContent = 'يرجى إدخال كود الطالب';
                errorMessage.classList.add('show');
                return;
            }
            
            const student = sheetData.find(row => row['الكود'] === codeInput);
            
            if (!student) {
                // إذا لم يتم العثور على الكود، لا يتم عرض أي نتيجة (فقط رسالة خطأ خفيفة)
                errorMessage.textContent = 'لم يتم العثور على نتيجة لهذا الكود';
                errorMessage.classList.add('show');
                return;
            }
            
            // عرض معلومات الطالب
            document.getElementById('studentName').textContent = student['الاسم'];
            document.getElementById('studentClass').textContent = student['الصف'];
            
            // قائمة المواد
            const subjects = ['الرياضيات', 'الفيزياء', 'الكيمياء', 'الأحياء', 'العربي', 'الكردي', 'الإنكليزية', 'الإسلامية'];
            const resultsGrid = document.getElementById('resultsGrid');
            resultsGrid.innerHTML = '';
            
            subjects.forEach(subject => {
                const gradeStr = student[subject];
                const grade = parseFloat(gradeStr);
                const isFailed = !isNaN(grade) && grade < 50;
                
                const subjectCard = document.createElement('div');
                // إضافة كلاس 'failed' إذا كانت العلامة أقل من 50 لتلوين الخانة بالأحمر
                subjectCard.className = `subject-card ${isFailed ? 'failed' : ''}`;
                subjectCard.innerHTML = `
                    <span class="subject-name">${subject}</span>
                    <span class="subject-grade">${isNaN(grade) ? '-' : grade}</span>
                `;
                resultsGrid.appendChild(subjectCard);
            });
            
            // التحقق من حالة الطالب (راسب أم ناجح)
            const status = student['النتيجة'];
            const averageSection = document.getElementById('averageSection');
            const statusBox = document.getElementById('statusBox');
            
            if (status === 'راسب') {
                // إذا كان راسباً، يتم إخفاء قسم المعدل وعرض المواد فقط
                averageSection.style.display = 'none';
            } else {
                averageSection.style.display = 'flex';
                document.getElementById('studentAverage').textContent = student['المعدل'];
                document.getElementById('studentStatus').textContent = status;
                
                if (status === 'ناجح') {
                    statusBox.className = 'info-box status-box pass';
                } else {
                    statusBox.className = 'info-box status-box';
                }
            }
            
            // إظهار بطاقة النتيجة بتأثير حركي
            resultCard.style.display = 'block';
            void resultCard.offsetWidth; // Trigger reflow for animation
            resultCard.classList.add('show');
        }

        // السماح بالبحث عند الضغط على زر Enter
        document.getElementById('studentCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchResult();
            }
        });

        // بدء جلب البيانات تلقائياً عند فتح الموقع
        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
