<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نتائج الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #f97316;
            --accent-dark: #ea580c;
            --black: #000000;
            --white: #ffffff;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-400: #a3a3a3;
            --gray-600: #525252;
            --gray-900: #171717;
            --red: #dc2626;
            --red-light: #fee2e2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--white);
            color: var(--gray-900);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header بسيط جداً */
        .header {
            border-bottom: 2px solid var(--black);
            padding: 24px 0;
            background: var(--white);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--black);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        /* قسم البحث */
        .search-hero {
            padding: 80px 0;
            text-align: center;
            background: var(--white);
        }

        .search-hero h1 {
            font-size: 3rem;
            font-weight: 800;
            color: var(--black);
            margin-bottom: 16px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .search-hero p {
            font-size: 1.125rem;
            color: var(--gray-600);
            margin-bottom: 48px;
            font-weight: 400;
        }

        .search-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 16px 20px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            background: var(--white);
        }

        .search-input:focus {
            border-color: var(--black);
        }

        .search-btn {
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            color: var(--white);
            background: var(--black);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background: var(--gray-900);
            transform: translateY(-2px);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .message.error {
            background: var(--red-light);
            color: var(--red);
            border: 2px solid var(--red);
            display: block;
        }

        /* قسم النتيجة */
        .result-section {
            display: none;
            padding: 60px 0;
            background: var(--gray-50);
        }

        .result-card {
            background: var(--white);
            border: 2px solid var(--black);
            border-radius: 12px;
            overflow: hidden;
        }

        .result-header {
            padding: 32px;
            background: var(--black);
            color: var(--white);
        }

        .result-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .result-meta {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-item label {
            font-size: 0.875rem;
            color: var(--gray-400);
            font-weight: 600;
        }

        .meta-item span {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--white);
        }

        /* جدول العلامات */
        .grades-section {
            padding: 32px;
        }

        .grades-section h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--black);
        }

        .grades-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .grade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .grade-item:hover {
            border-color: var(--black);
            transform: translateX(-4px);
        }

        .grade-item.failed {
            background: var(--red-light);
            border-color: var(--red);
        }

        .grade-item.failed:hover {
            border-color: var(--red);
        }

        .subject-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-900);
        }

        .grade-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--black);
        }

        .grade-item.failed .grade-value {
            color: var(--red);
        }

        /* قسم الملخص */
        .summary-section {
            padding: 32px;
            background: var(--gray-50);
            border-top: 2px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 24px;
        }

        .summary-item {
            text-align: center;
            padding: 24px 40px;
            background: var(--white);
            border: 2px solid var(--black);
            border-radius: 8px;
            min-width: 160px;
        }

        .summary-item label {
            display: block;
            font-size: 0.875rem;
            color: var(--gray-600);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .summary-item .value {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            color: var(--black);
        }

        .summary-item.success {
            background: var(--accent);
            border-color: var(--accent);
        }

        .summary-item.success .value {
            color: var(--white);
        }

        .summary-item.success label {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Footer */
        .footer {
            padding: 32px 0;
            text-align: center;
            color: var(--gray-600);
            font-size: 0.875rem;
            border-top: 1px solid var(--gray-200);
            background: var(--white);
        }

        @media (max-width: 640px) {
            .search-hero h1 {
                font-size: 2rem;
            }
            .search-form {
                flex-direction: column;
            }
            .search-btn {
                width: 100%;
            }
            .result-meta {
                flex-direction: column;
                gap: 16px;
            }
            .summary-section {
                flex-direction: column;
            }
            .summary-item {
                width: 100%;
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">نتائج<span>.</span></div>
            </div>
        </div>
    </div>

    <!-- Search Hero -->
    <div class="search-hero">
        <div class="container">
            <h1>استعلم عن نتيجتك الآن</h1>
            <p>أدخل كود الطالب الخاص بك لعرض كشف العلامات</p>
            
            <div class="search-form">
                <input type="text" id="studentCode" class="search-input" placeholder="كود الطالب" autocomplete="off">
                <button class="search-btn" id="searchBtn" onclick="searchResult()">
                    <span id="btnText">بحث</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
            
            <div id="messageBox" class="message"></div>
        </div>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="result-section">
        <div class="container">
            <div class="result-card">
                <div class="result-header">
                    <h2 id="studentName">اسم الطالب</h2>
                    <div class="result-meta">
                        <div class="meta-item">
                            <label>كود الطالب</label>
                            <span id="studentCode2">-</span>
                        </div>
                        <div class="meta-item">
                            <label>الصف الدراسي</label>
                            <span id="studentClass">-</span>
                        </div>
                    </div>
                </div>

                <div class="grades-section">
                    <h3>العلامات</h3>
                    <div class="grades-list" id="gradesList">
                        <!-- يتم الملء تلقائياً -->
                    </div>
                </div>

                <div id="summarySection" class="summary-section">
                    <div class="summary-item">
                        <label>المعدل العام</label>
                        <span class="value" id="studentAverage">0.00</span>
                    </div>
                    <div class="summary-item success">
                        <label>الحالة</label>
                        <span class="value" id="studentStatus">ناجح</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <p>© 2026 نظام نتائج الطلاب - جميع الحقوق محفوظة</p>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWdZi-3ePMb5-XUSYWtfNya8YDv9lwQfKIDODal6mq_GkYxyRlGgbn21fgcTqu0cwTzNANEigpZhQj/pub?output=csv';
        let sheetData = [];
        let isDataLoaded = false;

        const META_KEYS = ['الكود', 'الاسم', 'الصف', 'المعدل', 'النتيجة', 'الحالة', 'ملاحظات', 'الرقم'];

        async function fetchSheetData() {
            const btn = document.getElementById('searchBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل الاتصال');
                const csvText = await response.text();
                sheetData = parseCSV(csvText);
                isDataLoaded = true;
            } catch (error) {
                console.error('Error:', error);
                showMessage('حدث خطأ في الاتصال بالخادم', 'error');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                if (values.length >= headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        let val = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                        obj[header] = val;
                    });
                    data.push(obj);
                }
            }
            return data;
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.className = `message ${type}`;
        }

        function searchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const resultSection = document.getElementById('resultSection');
            
            document.getElementById('messageBox').style.display = 'none';
            resultSection.style.display = 'none';
            
            if (!isDataLoaded) {
                showMessage('البيانات قيد التحميل، يرجى الانتظار...', 'error');
                return;
            }
            
            if (!codeInput) {
                showMessage('يرجى إدخال كود الطالب', 'error');
                return;
            }
            
            const student = sheetData.find(row => row['الكود'] && row['الكود'].toString().trim() === codeInput);
            
            if (!student) {
                showMessage('لم يتم العثور على نتيجة لهذا الكود', 'error');
                return;
            }
            
            // عرض البيانات
            document.getElementById('studentName').textContent = student['الاسم'] || 'غير محدد';
            document.getElementById('studentCode2').textContent = student['الكود'] || codeInput;
            document.getElementById('studentClass').textContent = student['الصف'] || 'غير محدد';
            
            // بناء قائمة العلامات
            const gradesList = document.getElementById('gradesList');
            gradesList.innerHTML = '';
            
            let hasFailedSubject = false;
            
            Object.keys(student).forEach(key => {
                if (META_KEYS.includes(key) || !student[key] || student[key].trim() === '') return;
                
                const gradeVal = parseFloat(student[key]);
                const isFailed = !isNaN(gradeVal) && gradeVal < 50;
                
                if (isFailed) hasFailedSubject = true;
                
                const item = document.createElement('div');
                item.className = `grade-item ${isFailed ? 'failed' : ''}`;
                item.innerHTML = `
                    <span class="subject-name">${key}</span>
                    <span class="grade-value">${isNaN(gradeVal) ? student[key] : gradeVal}</span>
                `;
                gradesList.appendChild(item);
            });
            
            // منطق إخفاء المعدل
            const summarySection = document.getElementById('summarySection');
            const statusText = student['النتيجة'] || student['الحالة'] || 'غير محدد';
            
            if (statusText.includes('راسب') || hasFailedSubject) {
                summarySection.style.display = 'none';
            } else {
                summarySection.style.display = 'flex';
                document.getElementById('studentAverage').textContent = student['المعدل'] || '0.00';
                document.getElementById('studentStatus').textContent = statusText;
            }
            
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('studentCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchResult();
        });

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
