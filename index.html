<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام عن نتائج الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #059669;
            --success-bg: #d1fae5;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --danger-border: #fca5a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header رسمي */
        .header {
            background: var(--primary-dark);
            color: white;
            padding: 24px 0;
            border-bottom: 4px solid #fbbf24;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .header-text p {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* قسم البحث */
        .search-section {
            padding: 60px 0;
            background: white;
            border-bottom: 1px solid var(--border);
        }

        .search-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .search-title h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .search-title p {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .search-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            background: white;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .search-btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .message.error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 2px solid var(--danger-border);
            display: block;
        }

        /* قسم النتيجة */
        .result-section {
            display: none;
            padding: 60px 0;
        }

        .result-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* قسم اسم الطالب */
        .student-name-header {
            padding: 40px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            text-align: center;
            border-bottom: 3px solid #fbbf24;
        }

        .student-name-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .student-name-value {
            display: block;
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .student-meta {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .meta-item {
            text-align: center;
        }

        .meta-item label {
            display: block;
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .meta-item span {
            display: block;
            font-size: 1rem;
            font-weight: 700;
        }

        /* قسم العلامات */
        .grades-section {
            padding: 40px;
        }

        .grades-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .grades-table {
            width: 100%;
            border-collapse: collapse;
        }

        .grades-table th {
            background: #f9fafb;
            padding: 14px 20px;
            text-align: right;
            font-weight: 700;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
            font-size: 0.875rem;
        }

        .grades-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .grades-table tr:last-child td {
            border-bottom: none;
        }

        .grades-table tr:hover {
            background: #f9fafb;
        }

        .subject-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .grade-value {
            text-align: center;
            font-weight: 800;
            font-size: 1.25rem;
        }

        .grade-fail {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid var(--danger-border);
            display: inline-block;
        }

        /* قسم الملخص */
        .summary-section {
            padding: 32px 40px;
            background: #f9fafb;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .summary-card {
            padding: 24px 48px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            min-width: 180px;
        }

        .summary-card label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .summary-card .value {
            display: block;
            font-size: 2rem;
            font-weight: 900;
        }

        .summary-card.success {
            background: var(--success-bg);
            border-color: #6ee7b7;
        }

        .summary-card.success .value {
            color: var(--success);
        }

        .summary-card.fail {
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .summary-card.fail .value {
            color: var(--danger);
        }

        /* Footer */
        .footer {
            padding: 24px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            background: white;
        }

        @media (max-width: 768px) {
            .search-title h2 {
                font-size: 1.5rem;
            }
            .search-form {
                flex-direction: column;
            }
            .search-btn {
                width: 100%;
            }
            .student-name-value {
                font-size: 1.75rem;
            }
            .student-meta {
                flex-direction: column;
                gap: 16px;
            }
            .summary-section {
                flex-direction: column;
            }
            .summary-card {
                width: 100%;
            }
            .student-name-header,
            .grades-section,
            .summary-section {
                padding: 24px;
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="header-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>نظام الاستعلام عن نتائج الطلاب</h1>
                    <p>البوابة الرسمية للاستعلام عن النتائج الدراسية</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <div class="container">
            <div class="search-title">
                <h2>الاستعلام عن النتيجة</h2>
                <p>أدخل كود الطالب الخاص بك لعرض كشف العلامات</p>
            </div>
            
            <div class="search-form">
                <input type="text" id="studentCode" class="search-input" placeholder="كود الطالب" autocomplete="off">
                <button class="search-btn" id="searchBtn" onclick="searchResult()">
                    <span id="btnText">بحث</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
            
            <div id="messageBox" class="message"></div>
        </div>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="result-section">
        <div class="container">
            <div class="result-card">
                <!-- اسم الطالب -->
                <div class="student-name-header">
                    <span class="student-name-label">اسم الطالب</span>
                    <span class="student-name-value" id="studentName">-</span>
                    <div class="student-meta">
                        <div class="meta-item">
                            <label>كود الطالب</label>
                            <span id="studentCode2">-</span>
                        </div>
                        <div class="meta-item">
                            <label>الصف الدراسي</label>
                            <span id="studentClass">-</span>
                        </div>
                    </div>
                </div>

                <!-- العلامات -->
                <div class="grades-section">
                    <h3 class="grades-title">كشف العلامات</h3>
                    <table class="grades-table">
                        <thead>
                            <tr>
                                <th>المادة الدراسية</th>
                                <th style="text-align: center;">العلامة</th>
                            </tr>
                        </thead>
                        <tbody id="gradesBody">
                            <!-- يتم الملء تلقائياً -->
                        </tbody>
                    </table>
                </div>

                <!-- الملخص -->
                <div id="summarySection" class="summary-section">
                    <!-- يتم الملء تلقائياً -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <p>© 2026 نظام نتائج الطلاب - جميع الحقوق محفوظة</p>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWdZi-3ePMb5-XUSYWtfNya8YDv9lwQfKIDODal6mq_GkYxyRlGgbn21fgcTqu0cwTzNANEigpZhQj/pub?output=csv';
        let sheetData = [];
        let isDataLoaded = false;

        const META_KEYS = ['الكود', 'الاسم', 'الصف', 'المعدل', 'النتيجة', 'الحالة', 'ملاحظات', 'الرقم'];

        async function fetchSheetData() {
            const btn = document.getElementById('searchBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل الاتصال');
                const csvText = await response.text();
                sheetData = parseCSV(csvText);
                isDataLoaded = true;
            } catch (error) {
                console.error('Error:', error);
                showMessage('حدث خطأ في الاتصال بالخادم', 'error');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                if (values.length >= headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        let val = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                        obj[header] = val;
                    });
                    data.push(obj);
                }
            }
            return data;
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.className = `message ${type}`;
        }

        function searchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const resultSection = document.getElementById('resultSection');
            
            document.getElementById('messageBox').style.display = 'none';
            resultSection.style.display = 'none';
            
            if (!isDataLoaded) {
                showMessage('البيانات قيد التحميل، يرجى الانتظار...', 'error');
                return;
            }
            
            if (!codeInput) {
                showMessage('يرجى إدخال كود الطالب', 'error');
                return;
            }
            
            const student = sheetData.find(row => row['الكود'] && row['الكود'].toString().trim() === codeInput);
            
            if (!student) {
                showMessage('لم يتم العثور على نتيجة لهذا الكود', 'error');
                return;
            }
            
            // عرض اسم الطالب كاملاً
            document.getElementById('studentName').textContent = student['الاسم'] || 'غير محدد';
            document.getElementById('studentCode2').textContent = student['الكود'] || codeInput;
            document.getElementById('studentClass').textContent = student['الصف'] || 'غير محدد';
            
            // بناء جدول العلامات
            const gradesBody = document.getElementById('gradesBody');
            gradesBody.innerHTML = '';
            
            let hasFailedSubject = false;
            
            Object.keys(student).forEach(key => {
                if (META_KEYS.includes(key) || !student[key] || student[key].trim() === '') return;
                
                const gradeVal = parseFloat(student[key]);
                const isFailed = !isNaN(gradeVal) && gradeVal < 50;
                
                if (isFailed) hasFailedSubject = true;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="subject-name">${key}</td>
                    <td class="grade-value">
                        <span class="${isFailed ? 'grade-fail' : ''}">
                            ${isNaN(gradeVal) ? student[key] : gradeVal}
                        </span>
                    </td>
                `;
                gradesBody.appendChild(tr);
            });
            
            // منطق عرض الحالة والمعدل
            const summarySection = document.getElementById('summarySection');
            summarySection.innerHTML = '';
            
            const statusText = student['النتيجة'] || student['الحالة'] || 'غير محدد';
            const isFailed = statusText.includes('راسب') || hasFailedSubject;
            
            if (isFailed) {
                // راسب: إظهار الحالة فقط بدون المعدل
                const statusCard = document.createElement('div');
                statusCard.className = 'summary-card fail';
                statusCard.innerHTML = `
                    <label>الحالة النهائية</label>
                    <span class="value">راسب</span>
                `;
                summarySection.appendChild(statusCard);
            } else {
                // ناجح: إظهار المعدل والحالة
                const avgCard = document.createElement('div');
                avgCard.className = 'summary-card';
                avgCard.innerHTML = `
                    <label>المعدل العام</label>
                    <span class="value">${student['المعدل'] || '0.00'}</span>
                `;
                summarySection.appendChild(avgCard);
                
                const statusCard = document.createElement('div');
                statusCard.className = 'summary-card success';
                statusCard.innerHTML = `
                    <label>الحالة النهائية</label>
                    <span class="value">ناجح</span>
                `;
                summarySection.appendChild(statusCard);
            }
            
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('studentCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchResult();
        });

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
