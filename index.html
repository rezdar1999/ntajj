<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النتائج الدراسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.6);
            --bg-card-hover: rgba(30, 30, 45, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent-1: #6366f1;
            --accent-2: #8b5cf6;
            --accent-3: #ec4899;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-border: rgba(239, 68, 68, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية متدرجة متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            z-index: 0;
            animation: bgShift 20s ease infinite;
        }

        @keyframes bgShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            padding: 32px 0;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* قسم البحث */
        .search-section {
            padding: 80px 0;
            text-align: center;
        }

        .search-section h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .search-section p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 48px;
        }

        .search-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 18px 24px;
            font-size: 1.125rem;
            font-family: 'Cairo', sans-serif;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            padding: 18px 36px;
            font-size: 1.125rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            color: white;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        .search-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .search-btn:hover::before {
            left: 100%;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px -5px rgba(99, 102, 241, 0.5);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
            backdrop-filter: blur(10px);
        }

        .message.error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger-border);
            display: block;
        }

        /* قسم النتيجة */
        .result-section {
            display: none;
            padding: 0 0 80px;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* قسم اسم الطالب الكبير */
        .student-name-section {
            padding: 48px 40px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .student-name-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .student-name-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .student-name-value {
            display: block;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            position: relative;
            z-index: 1;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .student-meta {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-item label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-item span {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* قسم العلامات */
        .grades-section {
            padding: 40px;
        }

        .grades-section h3 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .grade-card {
            padding: 20px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .grade-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .grade-card.failed {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }

        .grade-card.failed:hover {
            border-color: var(--danger);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }

        .subject-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .grade-value {
            font-size: 1.75rem;
            font-weight: 900;
            color: var(--text-primary);
        }

        .grade-card.failed .grade-value {
            color: var(--danger);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        /* قسم الملخص */
        .summary-section {
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .summary-card {
            padding: 24px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: center;
            min-width: 200px;
            backdrop-filter: blur(10px);
        }

        .summary-card label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .summary-card .value {
            display: block;
            font-size: 2.5rem;
            font-weight: 900;
        }

        .summary-card.success {
            background: var(--success-bg);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .summary-card.success .value {
            color: var(--success);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .summary-card.fail {
            background: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .summary-card.fail .value {
            color: var(--danger);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 768px) {
            .search-section h1 {
                font-size: 2.5rem;
            }
            .search-form {
                flex-direction: column;
            }
            .search-btn {
                width: 100%;
            }
            .student-name-value {
                font-size: 2rem;
            }
            .student-meta {
                flex-direction: column;
                gap: 16px;
            }
            .grades-grid {
                grid-template-columns: 1fr;
            }
            .summary-section {
                flex-direction: column;
            }
            .summary-card {
                width: 100%;
            }
            .student-name-section,
            .grades-section,
            .summary-section {
                padding: 32px 24px;
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">منصة النتائج</div>
            </div>
        </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <div class="container">
            <h1>استعلم عن نتيجتك</h1>
            <p>أدخل كود الطالب لعرض كشف العلامات الكامل</p>
            
            <div class="search-form">
                <input type="text" id="studentCode" class="search-input" placeholder="كود الطالب" autocomplete="off">
                <button class="search-btn" id="searchBtn" onclick="searchResult()">
                    <span id="btnText">بحث</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
            
            <div id="messageBox" class="message"></div>
        </div>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="result-section">
        <div class="container">
            <div class="result-card">
                <!-- قسم اسم الطالب الكبير -->
                <div class="student-name-section">
                    <span class="student-name-label">اسم الطالب</span>
                    <span class="student-name-value" id="studentName">-</span>
                    <div class="student-meta">
                        <div class="meta-item">
                            <label>كود الطالب</label>
                            <span id="studentCode2">-</span>
                        </div>
                        <div class="meta-item">
                            <label>الصف الدراسي</label>
                            <span id="studentClass">-</span>
                        </div>
                    </div>
                </div>

                <!-- قسم العلامات -->
                <div class="grades-section">
                    <h3>العلامات</h3>
                    <div class="grades-grid" id="gradesGrid">
                        <!-- يتم الملء تلقائياً -->
                    </div>
                </div>

                <!-- قسم الملخص -->
                <div id="summarySection" class="summary-section">
                    <!-- يتم الملء تلقائياً بناءً على الحالة -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWdZi-3ePMb5-XUSYWtfNya8YDv9lwQfKIDODal6mq_GkYxyRlGgbn21fgcTqu0cwTzNANEigpZhQj/pub?output=csv';
        let sheetData = [];
        let isDataLoaded = false;

        const META_KEYS = ['الكود', 'الاسم', 'الصف', 'المعدل', 'النتيجة', 'الحالة', 'ملاحظات', 'الرقم'];

        async function fetchSheetData() {
            const btn = document.getElementById('searchBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل الاتصال');
                const csvText = await response.text();
                sheetData = parseCSV(csvText);
                isDataLoaded = true;
            } catch (error) {
                console.error('Error:', error);
                showMessage('حدث خطأ في الاتصال بالخادم', 'error');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                if (values.length >= headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        let val = values[index] ? values[index].trim().replace(/^"|"$/g, '') : '';
                        obj[header] = val;
                    });
                    data.push(obj);
                }
            }
            return data;
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.className = `message ${type}`;
        }

        function searchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const resultSection = document.getElementById('resultSection');
            
            document.getElementById('messageBox').style.display = 'none';
            resultSection.style.display = 'none';
            
            if (!isDataLoaded) {
                showMessage('البيانات قيد التحميل، يرجى الانتظار...', 'error');
                return;
            }
            
            if (!codeInput) {
                showMessage('يرجى إدخال كود الطالب', 'error');
                return;
            }
            
            const student = sheetData.find(row => row['الكود'] && row['الكود'].toString().trim() === codeInput);
            
            if (!student) {
                showMessage('لم يتم العثور على نتيجة لهذا الكود', 'error');
                return;
            }
            
            // عرض اسم الطالب كاملاً
            document.getElementById('studentName').textContent = student['الاسم'] || 'غير محدد';
            document.getElementById('studentCode2').textContent = student['الكود'] || codeInput;
            document.getElementById('studentClass').textContent = student['الصف'] || 'غير محدد';
            
            // بناء شبكة العلامات
            const gradesGrid = document.getElementById('gradesGrid');
            gradesGrid.innerHTML = '';
            
            let hasFailedSubject = false;
            
            Object.keys(student).forEach(key => {
                if (META_KEYS.includes(key) || !student[key] || student[key].trim() === '') return;
                
                const gradeVal = parseFloat(student[key]);
                const isFailed = !isNaN(gradeVal) && gradeVal < 50;
                
                if (isFailed) hasFailedSubject = true;
                
                const card = document.createElement('div');
                card.className = `grade-card ${isFailed ? 'failed' : ''}`;
                card.innerHTML = `
                    <span class="subject-name">${key}</span>
                    <span class="grade-value">${isNaN(gradeVal) ? student[key] : gradeVal}</span>
                `;
                gradesGrid.appendChild(card);
            });
            
            // منطق عرض الحالة والمعدل
            const summarySection = document.getElementById('summarySection');
            summarySection.innerHTML = '';
            
            const statusText = student['النتيجة'] || student['الحالة'] || 'غير محدد';
            const isFailed = statusText.includes('راسب') || hasFailedSubject;
            
            if (isFailed) {
                // راسب: إظهار الحالة فقط بدون المعدل
                const statusCard = document.createElement('div');
                statusCard.className = 'summary-card fail';
                statusCard.innerHTML = `
                    <label>الحالة النهائية</label>
                    <span class="value">راسب</span>
                `;
                summarySection.appendChild(statusCard);
            } else {
                // ناجح: إظهار المعدل والحالة
                const avgCard = document.createElement('div');
                avgCard.className = 'summary-card';
                avgCard.innerHTML = `
                    <label>المعدل العام</label>
                    <span class="value">${student['المعدل'] || '0.00'}</span>
                `;
                summarySection.appendChild(avgCard);
                
                const statusCard = document.createElement('div');
                statusCard.className = 'summary-card success';
                statusCard.innerHTML = `
                    <label>الحالة النهائية</label>
                    <span class="value">ناجح</span>
                `;
                summarySection.appendChild(statusCard);
            }
            
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('studentCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchResult();
        });

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
